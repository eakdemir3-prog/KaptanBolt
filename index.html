<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d2a1a">
<link rel="icon" href="data:,">
<title>Kaptan Bolt 2</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="dark" class="hidden"></div>
<div id="bossBar" class="hidden"><div class="bn" id="bossName"></div><div class="bb"><i id="bossTrail"></i><i id="bossFill"></i></div></div>
<div id="hud">
  <div class="pill" id="hearts"></div>
  <div class="pill coin"><img class="ci" src="props/coin_ui.webp" alt=""><span id="coins">0</span></div>
  <div class="sp"></div>
  <div class="pill"><span class="paw">🐾</span><span id="cages">0/3</span><img class="ci dim" id="hudStar" src="props/star.webp" alt=""></div>
  <button class="pill pbtn" id="pause" aria-label="Duraklat">❚❚</button>
</div>
<div id="toast"></div>
<div id="pad">
  <button class="b" id="bL" aria-label="Sol"><svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20"/></svg></button>
  <button class="b" id="bR" aria-label="Sağ"><svg viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20"/></svg></button>
  <button class="b fire hidden" id="bF" aria-label="Ateş"><svg viewBox="0 0 24 24"><path d="M13 2 L5 13 H11 L10 22 L19 10 H13 Z" fill="#fff" stroke="none"/></svg><span class="ch" id="fCh"><i></i><i></i><i></i></span></button>
  <button class="b jump" id="bJ" aria-label="Zıpla"><svg viewBox="0 0 24 24"><path d="M5 15 L12 8 L19 15"/></svg></button>
</div>
<div id="paused" class="modal hidden"><div class="card"><h2>Duraklatıldı</h2><button class="btn primary" id="resume">Devam Et</button><button class="btn" id="restart">Baştan Başla</button><button class="btn" id="toMap">Bölümler</button></div></div>
<div id="end" class="modal hidden"><div class="card"><h2 id="endTitle"></h2><div class="stars" id="endStars"></div><p id="endInfo"></p><button class="btn primary" id="next">Sonraki Bölüm ▶</button><button class="btn" id="again">Tekrar Oyna</button><button class="btn" id="endMap">Bölümler</button></div></div>
<div id="menu" class="screen hidden"><div class="logo">KAPTAN BOLT <span>2</span></div><div class="tag">Paslı Amiral hayvanları kafese kapattı. Kurtar onları!</div><button class="btn primary big" id="play">▶ OYNA</button></div>
<div id="map" class="screen hidden"><div class="maphead"><button class="pill pbtn" id="mapBack">◀</button><h2 id="mapTitle">🌿 Yeşil Vadi</h2><div class="wtabs" id="wtabs"></div><div class="pill" id="mapInfo"></div></div><div id="levels"></div></div>
<div id="splash"><div class="logo">KAPTAN BOLT <span>2</span></div><div class="sub">Yeşil Vadi yükleniyor…</div><div class="bar"><i></i></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
