<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#110c30">
<link rel="icon" href="data:,">
<title>Kaptan Bolt</title>
<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
<div id="splash"><svg class="sp-bolt" viewBox="0 0 40 60"><path d="M24 2 L6 34 H18 L14 58 L34 22 H22 Z"/></svg><div class="sp-bar"><i></i></div></div>
<div id="fader"></div>
<canvas id="c"></canvas>
<div id="ui">

  <!-- ANA MENÜ -->
  <div id="intro" class="hidden">
    <video id="introVid" playsinline preload="auto" poster="intro-poster.jpg" disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback"></video>
    <button class="intro-skip" data-act="introSkip">Geç ▶</button>
    <button class="intro-sound hidden" id="introSound" data-act="introSound">🔊 Sesi aç</button>
  </div>

  <section id="menu" class="screen">
    <div class="topbar">
      <button class="chip quest-btn" data-act="quests">🎯 <span>Görevler</span><b class="badge hidden" id="questBadge"></b></button>
      <div class="res"><div class="chip energy-chip" id="menuEnergy"></div><div class="chip coin-chip" id="menuCoins"></div></div>
    </div>
    <div class="logo big" id="menuLogo">
      <div class="l1">KAPTAN</div><div class="l2">BOLT</div><div class="swoosh"></div>
      <div class="tag">SON HAMLE</div>
    </div>
    <div class="menu-bottom" id="menuBottom">
      <button class="btn primary wide" data-act="continue"><span class="i-play"></span>Devam Et</button>
      <div class="menu-sub" id="menuSub"></div>
      <div class="menu-row">
        <button class="btn" data-act="worlds"><span class="i-grid"></span>Dünyalar</button>
        <button class="btn purple daily-btn" data-act="daily"><span class="dl">🧩 Günlük</span><small id="dailyInfo"></small></button>
      </div>
      <div class="menu-row">
        <button class="btn small gold-line" data-act="shop">🛒 Mağaza</button>
        <button class="btn small" data-act="garage">🎩 Kostüm</button>
        <button class="btn small icon-only" data-act="ach" aria-label="Başarımlar">🏆<b class="badge hidden" id="achBadge"></b></button>
        <button class="icon-btn settings-btn" data-act="settings" aria-label="Ayarlar"></button>
      </div>
    </div>
  </section>

  <!-- DÜNYALAR -->
  <section id="worlds" class="screen solid">
    <div class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Geri"></button>
      <div class="top-title">Dünyalar</div>
      <div class="res"><div class="chip energy-chip"></div><div class="chip coin-chip"></div></div>
    </div>
    <div class="scroll wcards" id="worldList"></div>
  </section>

  <!-- YOL HARİTASI -->
  <section id="map" class="screen solid">
    <div class="scroll" id="mapScroll"><div class="map-inner" id="mapInner"></div></div>
    <div class="map-fade"></div>
    <div class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Geri"></button>
      <div class="res"><div class="chip energy-chip"></div><div class="chip coin-chip"></div></div>
    </div>
    <div class="maphead" id="mapHead"></div>
  </section>

  <!-- KOSTÜMLER -->
  <section id="garage" class="screen solid">
    <div class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Geri"></button>
      <div class="top-title">Kostümler</div>
      <div class="res"><div class="chip coin-chip"></div></div>
    </div>
    <div class="hero"><img id="heroImg" alt=""><div class="name" id="heroName"></div></div>
    <div class="garage-panel"><div class="skin-grid" id="skinGrid"></div><p class="garage-tip">Bölüm bitirerek altın kazan, yeni kostümler aç.</p></div>
  </section>

  <!-- MAĞAZA -->
  <section id="shop" class="screen solid">
    <div class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Geri"></button>
      <div class="top-title">Mağaza</div>
      <div class="res"><div class="chip energy-chip"></div><div class="chip coin-chip"></div></div>
    </div>
    <div class="shop-tabs" id="shopTabs"></div>
    <div class="scroll shop-list" id="shopList"></div>
  </section>

  <!-- BAŞARIMLAR -->
  <section id="ach" class="screen solid">
    <div class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Geri"></button>
      <div class="top-title">Başarımlar</div>
      <div class="res"><div class="chip coin-chip"></div></div>
    </div>
    <div class="scroll ach-list" id="achList"></div>
  </section>

  <!-- OYUN -->
  <section id="game" class="screen">
    <div class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Geri"></button>
      <div class="chips">
        <div class="chip hidden" id="chipFloor"></div>
        <div class="chip" id="chipKeys"></div>
        <div class="chip" id="chipCollapse"></div>
        <div class="chip hidden" id="chipBoss"></div>
      </div>
      <button class="icon-btn hint-btn" data-act="hint" aria-label="İpucu"><span id="hintCount"></span></button>
    </div>
    <div class="logo small">
      <div class="l1">KAPTAN</div><div class="l2">BOLT</div>
      <div class="lvname" id="lvName"></div>
    </div>
    <div id="banner" class="banner hidden"></div>
    <div id="tutorial" class="tutorial hidden"></div>
    <div class="game-bottom">
      <div class="power-bar" id="powerBar"></div>
      <div class="moves" id="moveInfo"></div>
      <div class="game-row">
        <button class="btn" data-act="restart"><span class="i-restart"></span>Yeniden Başla</button>
      </div>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="card" id="card"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script type="module" src="/src/boot.js"></script>
</body>
</html>
