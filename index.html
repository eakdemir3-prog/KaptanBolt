<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#110c30">
<link rel="icon" href="data:,">
<title>Kaptan Bolt</title>
<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">

  <!-- ANA MENÜ -->
  <section id="menu" class="screen">
    <button class="icon-btn top-right" data-act="settings" aria-label="Ayarlar"></button>
    <div class="logo big">
      <div class="l1">KAPTAN</div><div class="l2">BOLT</div><div class="swoosh"></div>
      <div class="tag">SON HAMLE</div>
    </div>
    <div class="menu-bottom">
      <button class="btn primary wide" data-act="continue"><span class="i-play"></span>Devam Et</button>
      <div class="menu-sub" id="menuSub"></div>
      <button class="btn wide" data-act="levels"><span class="i-grid"></span>Bölümler</button>
      <div class="brand">EA Vision Labs</div>
    </div>
  </section>

  <!-- BÖLÜM SEÇİMİ -->
  <section id="levels" class="screen dim">
    <div class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Geri"></button>
      <div class="top-title">Bölümler</div>
      <div class="chip" id="starTotal"></div>
    </div>
    <div class="tabs" id="worldTabs"></div>
    <div class="world-head" id="worldHead"></div>
    <div class="lvgrid" id="lvGrid"></div>
    <div class="soon">🔒 Dünya 8–10 yakında: düğmeler, köprüler, ok kareler ve son kale…</div>
  </section>

  <!-- OYUN -->
  <section id="game" class="screen">
    <div class="topbar">
      <button class="icon-btn" data-act="back" aria-label="Geri"></button>
      <div class="chips">
        <div class="chip" id="chipKeys"></div>
        <div class="chip" id="chipCollapse" title="Çöken kareler"></div>
        <div class="chip hidden" id="chipBoss"></div>
      </div>
      <button class="icon-btn hint-btn" data-act="hint" aria-label="İpucu"><span id="hintCount"></span></button>
    </div>
    <div class="logo small">
      <div class="l1">KAPTAN</div><div class="l2">BOLT</div>
      <div class="lvname" id="lvName"></div>
    </div>
    <div id="banner" class="banner hidden"></div>
    <div id="tutorial" class="tutorial hidden"></div>
    <div class="game-bottom">
      <div class="moves" id="moveInfo"></div>
      <button class="btn wide" data-act="restart"><span class="i-restart"></span>Yeniden Başla</button>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="card" id="card"></div></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
