<!doctype html><html><body style="margin:0"><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
const S = 512, R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
R.setPixelRatio(1); R.setSize(S, S, false); R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 0.9;
const L = new GLTFLoader(); const out = {};
for (const n of ['devriye', 'takipci', 'boss', 'nobetci', 'bocek']) {
  const g = (await L.loadAsync('/public/models/' + n + '.glb')).scene;
  for (const ang of [0, Math.PI / 2]) {
    const sc = new THREE.Scene(); sc.background = new THREE.Color(0x1a1450);
    sc.add(new THREE.HemisphereLight(0xd8d0ff, 0x302060, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 2.4); d.position.set(-2, 4, 4); sc.add(d);
    const o = g.clone(); o.rotation.y = ang; sc.add(o);
    const c = new THREE.PerspectiveCamera(30, 1, 0.01, 50); c.position.set(0, 0.6, 2.4); c.lookAt(0, 0, 0);
    const comp = new EffectComposer(R); comp.addPass(new RenderPass(sc, c)); comp.addPass(new UnrealBloomPass(new THREE.Vector2(S, S), 0.35, 0.4, 0.85)); comp.addPass(new OutputPass());
    comp.render(); out[n + (ang ? '_side' : '')] = R.domElement.toDataURL('image/png');
  }
}
window.OUT = out; window.DONE = 1;
</script></body></html>
