name: KB2 test APK

on:
  push:
    branches: [kb2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Bağımlılıkları kur
        run: npm install
      - name: Oyunu derle
        run: npm run build
      - name: Android projesine kopyala
        run: npx cap sync android
      - name: APK üret
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK'yı yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk KaptanBolt2-test.apk
          gh release delete kb2-test -y --cleanup-tag || true
          gh release create kb2-test KaptanBolt2-test.apk --title "Kaptan Bolt 2 – deneme" --notes "Otomatik: ${GITHUB_SHA::7}" --prerelease --target kb2
